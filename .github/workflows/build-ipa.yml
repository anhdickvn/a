name: ChatMC Build IPA

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  build:

    runs-on: macos-15

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install XcodeGen
      run: |
        brew install xcodegen


    - name: Generate Xcode Project
      run: |
        xcodegen generate
        ls -la ChatMC.xcodeproj


    - name: Archive
      run: |
        xcodebuild archive \
        -project ChatMC.xcodeproj \
        -scheme ChatMC \
        -archivePath build/ChatMC.xcarchive \
        -sdk iphoneos \
        -destination generic/platform=iOS \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO


    - name: Create Unsigned IPA
      run: |
        mkdir -p build/Payload

        cp -R \
        build/ChatMC.xcodearchive/Products/Applications/ChatMC.app \
        build/Payload/ || \
        cp -R \
        build/ChatMC.xcarchive/Products/Applications/ChatMC.app \
        build/Payload/


        cd build

        zip -r ChatMC-unsigned.ipa Payload


    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ChatMC-IPA
        path: build/ChatMC-unsigned.ipa
