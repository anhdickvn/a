name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-26

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install XcodeGen
      run: |
        brew install xcodegen


    - name: Generate Xcode project
      run: |
        xcodegen generate
        ls -la
        xcodebuild -list -project ChatMC.xcodeproj


    - name: Archive
      run: |
        xcodebuild archive \
          -project ChatMC.xcodeproj \
          -scheme ChatMC \
          -archivePath build/ChatMC.xcarchive \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO


    - name: Package unsigned app
      run: |
        mkdir -p build/Payload

        cp -R \
        build/ChatMC.xcarchive/Products/Applications/ChatMC.app \
        build/Payload/ChatMC.app

        cd build
        zip -qry ChatMC-unsigned.ipa Payload


    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatMC-unsigned-ipa
        path: build/ChatMC-unsigned.ipa
