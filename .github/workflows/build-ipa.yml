name: ChatMC Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate
        xcodebuild -list -project ChatMC.xcodeproj

    - name: Archive
      run: |
        xcodebuild archive \
        -project ChatMC.xcodeproj \
        -scheme ChatMC \
        -archivePath build/ChatMC.xcarchive \
        -sdk iphoneos \
        -destination generic/platform=iOS \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO
