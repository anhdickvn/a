name: ChatMC

options:
  bundleIdPrefix: com.chatmc
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20


targets:

  ChatMC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - Sources

    dependencies:
      - package: ZIPFoundation

    settings:
      base:
        PRODUCT_NAME: ChatMC
        PRODUCT_BUNDLE_IDENTIFIER: com.chatmc.app
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO

        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO


schemes:

  ChatMC:
    shared: true

    build:
      targets:
        ChatMC:
          - all

    run:
      config: Debug

    archive:
      config: Release
